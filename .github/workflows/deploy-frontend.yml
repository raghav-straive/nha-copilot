name: Deploy frontend to GitHub Pages

# MANUAL ONLY — and it will fail until GitHub Pages is available here.
#
# GitHub Pages is not offered for a PRIVATE repository on a Free plan. With the
# repo private, enabling Pages is refused outright ("Your current plan does not
# support GitHub Pages for this repository"), so this workflow's build job
# succeeded and its deploy job failed on every single push. The automatic
# trigger is therefore switched off, to stop a guaranteed failure (and a failure
# email) on every commit. The frontend is still built and type-checked on every
# push by the `Tests` workflow, so nothing is lost by not running this.
#
# To use Pages, first make one of these true:
#   * make the repository public, or
#   * upgrade the plan (Pro/Team) to get Pages on private repos,
# then enable Settings -> Pages -> Source: "GitHub Actions", set the repository
# variable VITE_API_BASE to the backend's HTTPS URL, add that Pages origin to
# the backend's CORS_ORIGINS, and restore the `push:` trigger below.
#
# The recommended alternative is to skip Pages and serve the built frontend from
# the same nginx host as the backend (Layout A in deploy/nginx.conf.example).
# That is same-origin, which is what lets the httpOnly auth cookie work — see
# issues.md #25. Then no Pages deployment is needed at all.

on:
  workflow_dispatch: {}
  # Restore this once Pages is actually available for the repository:
  # push:
  #   branches: [main]
  #   paths:
  #     - "frontend/**"
  #     - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
