name: Deploy frontend to GitHub Pages

# Builds the React app and publishes it to GitHub Pages on every push to main
# that touches the frontend.
#
# Requires Pages enabled with Source: "GitHub Actions" (Settings -> Pages).
# Note Pages is only available for a PRIVATE repository on a paid plan; this
# repository is public, which is what makes it work on the Free plan.
#
# Set the repository VARIABLE `VITE_API_BASE` to the backend's HTTPS URL
# (Settings -> Secrets and variables -> Actions -> Variables). Without it the
# app builds with a relative API base, so the page loads but sign-in fails —
# there is no backend at the Pages origin.
#
# The backend must also list https://raghav-straive.github.io in CORS_ORIGINS.
# Being cross-origin, sign-in falls back to a stored token rather than the
# httpOnly cookie; serving both from one nginx host avoids that (see
# deploy/nginx.conf.example, Layout A, and issues.md #25).

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
